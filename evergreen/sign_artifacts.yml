# Garasign artifact signing function for Evergreen (TEMPLATE).
#
# Pattern from mongodb/mongo-rust-driver (.evergreen/releases.yml "sign
# release" and .evergreen/release-sign.sh), a public, working Evergreen
# signing pipeline. Evergreen cannot include YAML from another repo: copy
# this function into the project config.
#
# Hidden project variables needed (Evergreen project settings):
#   GARASIGN_USERNAME  Garasign username (ai-builder-experience)
#   GARASIGN_PASSWORD  Garasign password
#
# Credentials ride the environment, never the script text: Evergreen prints
# script text in task logs. The shell variables below ($GARASIGN_USERNAME,
# not ${GARASIGN_USERNAME}) stay unsubstituted in the log for the same reason.

functions:
  sign_artifact:
    - command: ec2.assume_role
      params:
        role_arn: arn:aws:iam::901841024863:role/ecr-role-evergreen-ro
    - command: shell.exec
      params:
        env:
          GARASIGN_USERNAME: ${GARASIGN_USERNAME}
          GARASIGN_PASSWORD: ${GARASIGN_PASSWORD}
          UNSIGNED_ARTIFACT: ${unsigned_artifact}
          DETACHED_SIGNATURE: ${detached_signature}
        script: |
          set -eu
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 901841024863.dkr.ecr.us-east-1.amazonaws.com
          echo "GRS_CONFIG_USER1_USERNAME=$GARASIGN_USERNAME" >> signing-envfile
          echo "GRS_CONFIG_USER1_PASSWORD=$GARASIGN_PASSWORD" >> signing-envfile
          docker run \
            --env-file=signing-envfile \
            --rm \
            -v $(pwd):$(pwd) \
            -w $(pwd) \
            901841024863.dkr.ecr.us-east-1.amazonaws.com/release-infrastructure/garasign-gpg \
            /bin/bash -c "gpgloader && gpg --yes -v --armor -o $DETACHED_SIGNATURE --detach-sign $UNSIGNED_ARTIFACT"

# Task usage example. Function vars carry the file names; the hidden project
# variables carry the credentials.
#
# tasks:
#   - name: sign_artifacts
#     commands:
#       - func: build  # produces dist/
#       - func: sign_artifact
#         vars:
#           unsigned_artifact: dist/abx-1.0.0-py3-none-any.whl
#           detached_signature: dist/abx-1.0.0-py3-none-any.whl.sig
#
# If the host uses Podman, replace docker with podman.
