#       - func: build  # produces dist/
#       - func: sign artifact
#         vars:
#           unsigned_artifact: dist/abx-1.0.0-py3-none-any.whl
#           detached_signature: dist/abx-1.0.0-py3-none-any.whl.sig
#
# If the host uses Podman, replace docker with podman.
