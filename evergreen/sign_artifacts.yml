# Garasign artifact signing for Evergreen.
#
# The shell lives in this repo, in evergreen/ecr-login.sh and
# evergreen/sign-artifact.sh. What stays below is the part that cannot: the
# ec2.assume_role built-in, and the environment that carries the credentials
# into the scripts. Copy this function into the project config, and call
# "fetch abx-release-tools" (evergreen/fetch.yml) first.
#
# Pattern from mongodb/mongo-rust-driver (.evergreen/releases.yml "sign
# release" and .evergreen/release-sign.sh), a public, working Evergreen
# signing pipeline.
#
# Hidden project variables needed (Evergreen project settings):
#   GARASIGN_USERNAME  Garasign username (ai-builder-experience)
#   GARASIGN_PASSWORD  Garasign password
#   GPG_KEY_ID         Key to sign with
#
# Credentials ride the environment, never the script text: Evergreen prints
# script text in task logs.

functions:
  sign_artifact:
    - command: ec2.assume_role
      params:
        role_arn: arn:aws:iam::901841024863:role/ecr-role-evergreen-ro
    - command: shell.exec
      params:
        env:
          AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
          AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
        script: bash abx-release-tools/evergreen/ecr-login.sh
    - command: shell.exec
      params:
        env:
          GARASIGN_USERNAME: ${GARASIGN_USERNAME}
          GARASIGN_PASSWORD: ${GARASIGN_PASSWORD}
          GPG_KEY_ID: ${GPG_KEY_ID}
          UNSIGNED_ARTIFACT: ${unsigned_artifact}
          DETACHED_SIGNATURE: ${detached_signature}
        script: bash abx-release-tools/evergreen/sign-artifact.sh

# Task usage example. Function vars carry the file names; the hidden project
# variables carry the credentials.
#
# tasks:
#   - name: sign_artifacts
#     commands:
#       - func: "fetch abx-release-tools"
#       - func: build  # produces dist/
#       - func: sign_artifact
#         vars:
#           unsigned_artifact: dist/abx-1.0.0-py3-none-any.whl
#           detached_signature: dist/abx-1.0.0-py3-none-any.whl.sig
#
# On a Podman host, set CONTAINER_CMD: podman in both env blocks.
