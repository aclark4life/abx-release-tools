# Papertrail trace function for Evergreen.
#
# The version derivation lives in this repo, in evergreen/release-version.sh.
# papertrail.trace and expansions.update are Evergreen built-ins, so they stay
# below. Copy this function into the project config, and call
# "fetch abx-release-tools" (evergreen/fetch.yml) first.
#
# Pattern from public Evergreen release configs: mongodb/mongo-java-driver
# (.evergreen/.evg.yml "publish" trace function) and mongodb/mongo-rust-driver
# (.evergreen/releases.yml "publish papertrail"). Pass the product name as a
# function var at the call site.
#
# Hidden project variables needed (Evergreen project settings):
#   papertrail_key_id      Papertrail Key ID
#   papertrail_secret_key  Papertrail Secret Key
#
# Rules:
# - One trace per customer-downloadable file (wheels, sdists, checksums,
#   signature files).
# - The command rejects two files with the same name in one call.
# - Use a dev product name (for example <product>-dev) on non-release builds.
# - Filenames must include the version and be unique across releases.

functions:
  trace artifacts:
    - command: shell.exec
      params:
        # Set TAG_PREFIX empty for a project that tags without a leading v.
        script: bash abx-release-tools/evergreen/release-version.sh
    - command: expansions.update
      params:
        file: trace-expansions.yml
    - command: papertrail.trace
      params:
        key_id: ${papertrail_key_id}
        secret_key: ${papertrail_secret_key}
        product: ${product}
        version: ${release_version}
        filenames:
          - "dist/*.whl"
          - "dist/*.tar.gz"
          - "dist/*.sig"

# Add the function to the release task, after publishing. Pass the product
# name as a function var: the agreed product name on release builds, a dev
# product name (for example <product>-dev) on non-release builds.
