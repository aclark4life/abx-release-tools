# SilkBomb SBOM upload/augment functions and tasks for Evergreen (TEMPLATE —
# verify before use).
#
# Pattern from the internal SilkBomb CI onboarding doc. Evergreen cannot
# include YAML from another repo: copy these into the project config and adapt
# the TODO values.
#
# Project variables needed (Evergreen project settings):
#   silkbomb_role_arn: arn:aws:iam::119629040606:role/silkbomb
#   devprod_platforms_ecr_readonly_role_arn: arn:aws:iam::901841024863:role/ecr-role-evergreen-ro
#   KONDUKTO_TOKEN: hidden project variable
#     TODO: confirm how the token is supplied on Evergreen (hidden project
#     variable, or read from AWS Secrets Manager via the silkbomb role).

functions:
  generate sbom:
    - command: shell.exec
      params:
        script: |
          set -eu
          pip install cyclonedx-py
          # Generate from the pinned release requirements, not dev dependencies.
          cyclonedx-py requirements --of json -o ${workdir}/sbom.json

  write silkbomb environment file:
    - command: ec2.assume_role
      params:
        role_arn: ${silkbomb_role_arn}
    - command: shell.exec
      params:
        # silent: the script text contains session credentials.
        silent: true
        script: |
          cat <<EOF > ${workdir}/silkbomb.env
          AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}
          KONDUKTO_TOKEN=${KONDUKTO_TOKEN}
          EOF

  run silkbomb:
    - command: ec2.assume_role
      params:
        role_arn: ${devprod_platforms_ecr_readonly_role_arn}
    - command: shell.exec
      params:
        script: |
          set -eu
          ECR_HOST=901841024863.dkr.ecr.us-east-1.amazonaws.com
          aws ecr get-login-password --region us-east-1 | podman login --username AWS --password-stdin "$ECR_HOST"
          podman run --rm \
            --env-file=${workdir}/silkbomb.env \
            -v ${workdir}:/workdir \
            "$ECR_HOST/release-infrastructure/silkbomb:2.0" \
            ${SILKBOMB_COMMAND} ${SILKBOMB_ARGS}

tasks:
  - name: upload_sbom_to_kondukto
    commands:
      - func: generate sbom
      - func: write silkbomb environment file
      - func: run silkbomb
        vars:
          SILKBOMB_COMMAND: upload
          SILKBOMB_ARGS: >-
            --sbom-in /workdir/sbom.json
            --repo <TODO org>/<TODO repo>
            --branch ${branch_name}

  - name: augment_sbom
    commands:
      - func: generate sbom
      - func: write silkbomb environment file
      - func: run silkbomb
        vars:
          SILKBOMB_COMMAND: augment
          SILKBOMB_ARGS: >-
            --sbom-in /workdir/sbom.json
            --sbom-out /workdir/cyclonedx.sbom.json
            --repo <TODO org>/<TODO repo>
            --branch ${branch_name}

buildvariants:
  - name: ssdlc
    display_name: SSDLC
    run_on:
      - rhel9-latest-small
    tasks:
      - name: upload_sbom_to_kondukto
      - name: augment_sbom
