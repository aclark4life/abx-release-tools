# SilkBomb SBOM function and task for Evergreen.
#
# The shell lives in this repo, in evergreen/generate-sbom.sh,
# evergreen/ecr-login.sh and evergreen/upload-sbom.sh. What stays below is the
# part that cannot: the ec2.assume_role and expansions.update built-ins, and
# the environment that carries the session credentials into the scripts. Copy
# these into the project config, adapt the TODO values, and call
# "fetch abx-release-tools" (evergreen/fetch.yml) first.
#
# Pattern from mongodb/mongo-csharp-driver: evergreen/evergreen.yml
# "upload-sbom" and evergreen/upload-sbom.sh, a public, working Evergreen
# pipeline.
#
# upload only: it needs no Kondukto token, just the silkbomb IAM role's AWS
# session credentials. The augmented SBOM that ships with a release is
# produced on GitHub Actions by the sbom action, which reads KONDUKTO_TOKEN
# from the AWS secret the setup action fetches, the same path pymongo's
# release runs.
#
# Project variables needed (Evergreen project settings):
#   silkbomb_role_arn: arn:aws:iam::119629040606:role/silkbomb
#   devprod_platforms_ecr_readonly_role_arn: arn:aws:iam::901841024863:role/ecr-role-evergreen-ro
#   branch_name: the branch being scanned
#
# Session credentials ride the environment, never the script text: Evergreen
# prints script text in task logs.

functions:
  generate_sbom:
    - command: shell.exec
      params:
        script: bash abx-release-tools/evergreen/generate-sbom.sh

  login_to_ecr:
    # DOCKER_CONFIG keeps the login valid after the assume_role below
    # switches credentials (mongo-csharp-driver pattern).
    - command: expansions.update
      params:
        updates:
          - key: DOCKER_CONFIG
            value: "${workdir}/.docker"
    - command: ec2.assume_role
      params:
        role_arn: ${devprod_platforms_ecr_readonly_role_arn}
    - command: shell.exec
      params:
        env:
          AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
          AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
        script: bash abx-release-tools/evergreen/ecr-login.sh

  upload_sbom:
    - command: ec2.assume_role
      params:
        role_arn: ${silkbomb_role_arn}
    - command: shell.exec
      params:
        env:
          AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
          AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
          KONDUKTO_REPO: <TODO org>/<TODO repo>
          KONDUKTO_BRANCH: ${branch_name}
        script: bash abx-release-tools/evergreen/upload-sbom.sh

tasks:
  - name: UPLOAD_SBOM_TO_KONDUKTO
    commands:
      - func: "fetch abx-release-tools"
      - func: generate_sbom
      - func: login_to_ecr
      - func: upload_sbom

buildvariants:
  - name: ssdlc
    display_name: SSDLC
    run_on:
      - rhel9-latest-small
    tasks:
      - name: UPLOAD_SBOM_TO_KONDUKTO
