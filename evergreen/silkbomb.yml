# SilkBomb SBOM function and task for Evergreen (TEMPLATE).
#
# Pattern from mongodb/mongo-csharp-driver: evergreen/evergreen.yml
# "upload-sbom" and evergreen/upload-sbom.sh — a public, working Evergreen
# pipeline. Evergreen cannot include YAML from another repo: copy these into
# the project config and adapt the TODO values.
#
# upload only: it needs no Kondukto token, just the silkbomb IAM role's AWS
# session credentials (mongo-csharp-driver upload-sbom.sh). The augmented
# SBOM that ships with a release is produced on GitHub Actions by the sbom
# action, which reads KONDUKTO_TOKEN from the AWS secret the setup action
# fetches — the same path pymongo's release runs.
#
# Project variables needed (Evergreen project settings):
#   silkbomb_role_arn: arn:aws:iam::119629040606:role/silkbomb
#   devprod_platforms_ecr_readonly_role_arn: arn:aws:iam::901841024863:role/ecr-role-evergreen-ro
#   branch_name: the branch being scanned
#
# Session credentials ride the environment, never the script text: Evergreen
# prints script text in task logs.

functions:
  generate_sbom:
    - command: shell.exec
      params:
        script: |
          set -eu
          pip install cyclonedx-py
          # Generate from the pinned release requirements, not dev dependencies.
          cyclonedx-py requirements --of json -o sbom.json

  login_to_ecr:
    # DOCKER_CONFIG keeps the login valid after the assume_role below
    # switches credentials (mongo-csharp-driver pattern).
    - command: expansions.update
      params:
        updates:
          - key: DOCKER_CONFIG
            value: "${workdir}/.docker"
    - command: ec2.assume_role
      params:
        role_arn: ${devprod_platforms_ecr_readonly_role_arn}
    - command: shell.exec
      params:
        env:
          AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
          AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
        script: |
          set -eu
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 901841024863.dkr.ecr.us-east-1.amazonaws.com

  upload_sbom:
    - command: ec2.assume_role
      params:
        role_arn: ${silkbomb_role_arn}
    - command: shell.exec
      params:
        env:
          AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
          AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
          AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN}
        script: |
          set -eu
          docker run --rm -v "$(pwd):/pwd" \
            --user "$(id -u):$(id -g)" \
            --env AWS_ACCESS_KEY_ID --env AWS_SECRET_ACCESS_KEY --env AWS_SESSION_TOKEN \
            901841024863.dkr.ecr.us-east-1.amazonaws.com/release-infrastructure/silkbomb:2.0 \
            upload --repo <TODO org>/<TODO repo> --branch "${branch_name}" --sbom-in /pwd/sbom.json

tasks:
  - name: UPLOAD_SBOM_TO_KONDUKTO
    commands:
      - func: generate_sbom
      - func: login_to_ecr
      - func: upload_sbom

buildvariants:
  - name: ssdlc
    display_name: SSDLC
    run_on:
      - rhel9-latest-small
    tasks:
      - name: UPLOAD_SBOM_TO_KONDUKTO
