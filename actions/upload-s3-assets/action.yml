# Extracted from mongodb-labs/drivers-github-tools@99b1cbd (upstream path: upload-s3-assets/action.yml),
# then hardened. The inputs and the S3 key layout are unchanged.
#
# Divergence from upstream, deliberate:
#   - Inputs reach the script through `env:` rather than being interpolated into `run:`.
#   - The destination bucket is checked before the loop. Upstream expands an unset AWS_BUCKET into
#     `s3:///product/version/file`, which fails per file with an opaque error.
#   - A pattern that matches nothing is an error. An upload step that silently uploads nothing and
#     exits 0 is the failure mode this whole step exists to prevent.
name: Upload S3 assets
description: Uploads assets from the S3 asset directory
inputs:
  version:
    description: "The published version"
    required: true
  product_name:
    description: "The name of the product"
    required: true
  filenames:
    description: "Files to upload; space- or newline-separated, each may be a glob pattern"
    default: '*'
    required: false
  dry_run:
    description: "Only print files that would be uploaded, but don't upload any files"
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - shell: bash
      working-directory: ${{ env.S3_ASSETS }}
      env:
        VERSION: ${{ inputs.version }}
        PRODUCT_NAME: ${{ inputs.product_name }}
        FILENAMES: ${{ inputs.filenames }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail

        if [ "$DRY_RUN" != "true" ]; then
          : "${AWS_BUCKET:?not set; run the setup action first, with RELEASE_ASSETS_BUCKET in the secret}"
        fi

        # A newline in the input means one pattern per line, and a pattern may then contain a
        # space. Without a newline the input is a space-separated list, which cannot express one.
        patterns=()
        if [[ "$FILENAMES" == *$'\n'* ]]; then
          while IFS= read -r line; do
            [ -n "$line" ] && patterns+=("$line")
          done <<< "$FILENAMES"
        else
          # shellcheck disable=SC2206  # deliberate: a space-separated list is the legacy form
          patterns=($FILENAMES)
        fi

        files=()
        for pattern in "${patterns[@]}"; do
          # IFS empty so the pattern is not word-split before it is globbed: a pattern containing a
          # space must stay one word. Pathname expansion still yields one field per match. An
          # unmatched glob stays literal, and the existence test below rejects it.
          saved_ifs=$IFS
          IFS=''
          # shellcheck disable=SC2206  # deliberate: this is the glob expansion
          matches=($pattern)
          IFS=$saved_ifs
          matched=0
          for path in "${matches[@]}"; do
            if [ -f "$path" ]; then
              matched=1
              # Two patterns can match the same file. Keeping it once means it is signed,
              # reported or uploaded once; the second pass over it would act on a file the
              # first pass has already moved. Linear scan: the list is a release's worth.
              already=0
              for seen in ${files[@]+"${files[@]}"}; do
                if [ "$seen" = "$path" ]; then
                  already=1
                  break
                fi
              done
              if [ "$already" -eq 0 ]; then
                files+=("$path")
              fi
            fi
          done
          if [ "$matched" -eq 0 ]; then
            echo "::error::no file matches '$pattern' in $PWD"
            exit 1
          fi
        done

        if [ "${#files[@]}" -eq 0 ]; then
          echo "::error::filenames expanded to nothing in $PWD"
          exit 1
        fi

        for path in "${files[@]}"; do
          destination="s3://${AWS_BUCKET:-UNSET}/${PRODUCT_NAME}/${VERSION}/${path}"
          if [ "$DRY_RUN" != "true" ]; then
            # ./ prefix so a filename beginning with a dash is not read as a flag.
            aws s3 cp "./$path" "$destination"
          else
            echo "Would upload ${path} to ${PRODUCT_NAME}/${VERSION}/${path}"
            echo "Dry run, skipping S3 upload of ${path}" >> "$GITHUB_STEP_SUMMARY"
          fi
        done
