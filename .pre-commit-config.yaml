# Extracted from mongodb-labs/drivers-github-tools@99b1cbd
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.4.0
  hooks:
  - id: check-added-large-files
  - id: check-case-conflict
  - id: check-yaml
  - id: trailing-whitespace
    exclude: dist/index.js

# We use the Python version instead of the original version which seems to require Docker
# https://github.com/koalaman/shellcheck-precommit
- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.9.0.6
  hooks:
    - id: shellcheck
      name: shellcheck
      # Default severity, not --severity=warning: SC2086, an unquoted expansion, is a note.
      # The repository shipped one on a caller-controlled path.
      stages: [manual]

- repo: https://github.com/sirosen/check-jsonschema
  rev: 0.28.3
  hooks:
    - id: check-github-actions
      files: >
        (?x)^(
          actions/.*action\.(yml|yaml)
        )$
    - id: check-github-workflows
